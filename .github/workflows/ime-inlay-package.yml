name: IME inlay package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to package
        required: true
        default: fix/terminal-ime-inlay-wrap

permissions:
  contents: write

concurrency:
  group: ime-inlay-package
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/share/miniconda \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/node \
            /opt/microsoft \
            /opt/google \
            /imagegeneration \
            /var/cache/apt/archives
          sudo apt-get -y clean
          docker image prune --all --force || true
          docker builder prune --all --force || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Checkout Android modules
        uses: actions/checkout@v4
        with:
          repository: JetBrains/android
          path: android
          ref: master
          fetch-depth: 1

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 30G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Build macOS aarch64 IDE
        run: |
          docker build . --target intellij_idea --tag intellij_idea_env
          docker run --rm --user "$(id -u)" \
            --volume "$PWD:/community" \
            intellij_idea_env \
            -Dintellij.build.target.os=mac \
            -Dintellij.build.target.arch=aarch64

      - name: List artifacts
        run: |
          find out/idea-ce/artifacts -maxdepth 1 -type f -printf '%f %s\n' 2>/dev/null || true

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ime-inlay-${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          mapfile -t assets < <(find out/idea-ce/artifacts -maxdepth 1 -type f \( -name '*.sit' -o -name '*.dmg' -o -name '*.tar.gz' \) -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No distributable artifact found"
            exit 1
          fi
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IME inlay CI $TAG" \
            --notes "Built from $GITHUB_SHA"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
